name: Deploy NexGen sites to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: research-app/package-lock.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install research app dependencies
        working-directory: research-app
        run: npm ci
      - name: Validate research data and timeline
        working-directory: research-app
        run: npm test
      - name: Build research app
        working-directory: research-app
        run: npm run build -- --base=/NexGen-Air-Battlespace/research/
      - name: Package both sites
        shell: bash
        run: |
          mkdir -p _site/research
          cp index.html script.js styles.css entities.json missions.json _site/
          cp -R images _site/images
          cp -R research-app/dist/. _site/research/
          touch _site/.nojekyll
          test -f _site/research/index.html
          test -f _site/research/assets/maps/land.geojson
          test -f _site/research/assets/entities/f35.png
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
